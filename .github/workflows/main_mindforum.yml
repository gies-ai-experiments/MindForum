# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mindforum

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mindforum_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/mindforum_ci
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"

      - name: npm install, build, and test
        run: |
          npm install
          npm run migrate
          npm run build --if-present
          npm run test --if-present

      - name: Package standalone app
        run: |
          mkdir -p azure-package/.next/static
          if [ -d .next/standalone/MindForum ]; then
            cp -R .next/standalone/MindForum/. azure-package/
          else
            cp -R .next/standalone/. azure-package/
          fi
          cp -R .next/static/. azure-package/.next/static/
          if [ -d public ]; then cp -R public azure-package/public; fi
          # Zip the package before upload. actions/upload-artifact@v4 excludes
          # hidden files by default, which silently drops the .next/ build dir
          # (a dot-directory) when the package is uploaded as a folder — the deploy
          # then ships server.js but a stale .next, so prod serves the old build.
          # Zipping (mirrors the staging workflow) keeps .next/ inside the archive.
          cd azure-package
          zip -r ../azure-package.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: azure-package.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: mindforum
          slot-name: Production
          package: azure-package.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_770B002F327B4D6A824B31DDF8168E8C }}
